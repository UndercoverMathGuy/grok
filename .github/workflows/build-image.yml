name: build-trainer-image

on:
  push:
    branches: [main, master]
    paths: ["cloud/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker tags must be lowercase; github.repository keeps the owner's caps.
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${REPO,,}/semifinal-trainer" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cloud
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test (CPU) inside the built image
        run: |
          docker run --rm --entrypoint python \
            "$IMAGE:${{ github.sha }}" \
            -u train_semifinal_torch.py --smoke --compile off
