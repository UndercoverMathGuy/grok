[project]
name = "grok"
version = "0.1.0"
description = "Grokking on modular addition in MLX — training + mech interp analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx>=0.32.0",
    "numpy>=2.5.1",
    "plotly>=6.9.0",
    "scipy>=1.18.0",
    "tqdm>=4.69.0",
]

[dependency-groups]
# Only needed for scripts/convert_torch_run.py (original paper checkpoints)
convert = ["torch>=2.13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grok"]
